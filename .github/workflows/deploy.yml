name: 🚀 Build & Deploy BreastVision to Render (breastvision.runs-on.dev)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-validate:
    name: 🏗️ Build BreastVision (Node.js + Expo Web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: breastvision

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('breastvision/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm check

      - name: Export Expo web bundle
        run: pnpm expo export --platform web

      - name: Build Express server
        run: pnpm build

      - name: Verify build output
        run: |
          echo "=== Expo web bundle (dist/) ==="
          ls -lh dist/
          echo "=== Express server bundle (dist-server/) ==="
          ls -lh dist-server/ 2>/dev/null || echo "dist-server not present (built inside Docker/Render)"
          echo "=== Health: index.html present ==="
          test -f dist/index.html && echo "✅ index.html found" || (echo "❌ index.html missing" && exit 1)

  deploy-to-render:
    name: 🌐 Deploy to Render
    runs-on: ubuntu-latest
    needs: build-and-validate
    environment:
      name: production
      url: https://breastvision.runs-on.dev

    steps:
      - name: Trigger Render Deploy Hook
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            echo "RENDER_DEPLOY_HOOK_URL secret not set — skipping."
            echo "Add it under Settings > Secrets > Actions (see DEPLOYMENT_RUNS_ON.md)."
            exit 0
          fi
          echo "Triggering Render deploy..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}")
          echo "Render response: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -ne 200 ] && [ "$HTTP_STATUS" -ne 201 ]; then
            echo "Render deploy hook failed with status $HTTP_STATUS"
            exit 1
          fi
          echo "Render deployment triggered successfully."

      - name: Wait for deployment and health-check
        run: |
          echo "Waiting 90s for Render to spin up..."
          sleep 90
          MAX_RETRIES=12
          RETRY_INTERVAL=15
          for i in $(seq 1 $MAX_RETRIES); do
            HTTP=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "https://breastvision.runs-on.dev/api/health" 2>/dev/null || echo "000")
            echo "Attempt $i/$MAX_RETRIES — /api/health returned: $HTTP"
            if [ "$HTTP" = "200" ]; then
              echo "✅ breastvision.runs-on.dev is LIVE!"
              exit 0
            fi
            sleep $RETRY_INTERVAL
          done
          echo "Health-check timed out — check Render logs."
          exit 1
