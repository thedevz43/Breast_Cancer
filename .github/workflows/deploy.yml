name: 🚀 Build & Deploy to Render (breastvision.runs-on.dev)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-validate:
    name: 🐋 Build Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (validation build)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./deploy/Dockerfile
          push: false
          tags: breastvision-platform:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-render:
    name: 🌐 Deploy to Render
    runs-on: ubuntu-latest
    needs: build-and-validate
    environment:
      name: production
      url: https://breastvision.runs-on.dev

    steps:
      - name: Trigger Render Deploy Hook
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            echo "RENDER_DEPLOY_HOOK_URL secret not set - skipping."
            echo "Follow DEPLOYMENT_RUNS_ON.md to add it under Settings > Secrets > Actions."
            exit 0
          fi
          echo "Triggering Render deploy..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}")
          echo "Render response: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -ne 200 ] && [ "$HTTP_STATUS" -ne 201 ]; then
            echo "Render deploy hook failed with status $HTTP_STATUS"
            exit 1
          fi
          echo "Render deployment triggered successfully."

      - name: Wait for deployment and health-check
        run: |
          echo "Waiting 90s for Render to spin up..."
          sleep 90
          MAX_RETRIES=12
          RETRY_INTERVAL=15
          for i in $(seq 1 $MAX_RETRIES); do
            HTTP=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "https://breastvision.runs-on.dev/health" 2>/dev/null || echo "000")
            echo "Attempt $i/$MAX_RETRIES - /health returned: $HTTP"
            if [ "$HTTP" = "200" ]; then
              echo "breastvision.runs-on.dev is LIVE!"
              exit 0
            fi
            sleep $RETRY_INTERVAL
          done
          echo "Health-check timed out - check Render logs."
          exit 1
