cohort_A:
  description: Merged BUS-UCLM and BrEaST-Lesions datasets eliminating duplicate image
    counts
  name: UCLM_BrEaST_Unified
  source_datasets:
  - BUS-UCLM
  - BrEaST-Lesions-USG-images_and_masks
