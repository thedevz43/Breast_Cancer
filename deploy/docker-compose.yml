services:
  breastvision:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: breastvision
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      # Copy your .env values here for local Docker testing:
      # - JWT_SECRET=your-secret-here
      # - DATABASE_URL=mysql://user:pass@host/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', r => process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
