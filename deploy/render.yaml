services:
  - type: web
    name: breastvision
    runtime: node
    region: oregon
    plan: free
    rootDir: breastvision
    buildCommand: pnpm install --frozen-lockfile && pnpm expo export --platform web && pnpm build
    startCommand: pnpm start
    healthCheckPath: /api/health
    buildFilter:
      paths:
        - breastvision/**
        - deploy/render.yaml
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: EXPO_PUBLIC_API_URL
        value: "https://breastvision.runs-on.dev"
      # Set these secrets in Render Dashboard → Environment:
      # - key: MONGODB_URI         (mongodb+srv://user:pass@cluster.mongodb.net/breastvision)
      # - key: JWT_SECRET          (min 32 chars, random)
      # - key: DATABASE_URL        (optional mysql or fallback)
      # - key: OAUTH_SERVER_URL
      # - key: VITE_APP_ID
      # - key: OWNER_OPEN_ID
